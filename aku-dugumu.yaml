# 2. ESP32: akünün yanına konacak düğüm (2026-11-07)
# Şimdilik: akü BMS'i (Bluetooth). Sonra: ısıtıcı, ışık röleleri, park sensörü vb.
# NOT: BMS aynı anda tek bağlantı kabul ediyor → bu kart karavana takılınca
#      sensor-dugumu.yaml'dan BMS kısmı çıkarılacak.

substitutions:
  ntfy_konu: !secret ntfy_konu

esphome:
  name: aku-dugumu
  on_boot:
    # OTA sırasında kapatılan akü bağlantısını açılışta geri aç
    - priority: -100
      then:
        - switch.turn_on: bms_baglanti

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  # Daly BMS (akü) Bluetooth bileşeni, test edilen sürüme sabitlendi
  - source: github://syssi/esphome-daly-bms@b0e79de238c756bce67f8415c82febc6d79cb67c
    refresh: never

logger:

api:
  encryption:
    key: !secret api_anahtari

ota:
  - platform: esphome
    encryption:
    on_begin:
      - switch.turn_off: bms_baglanti

wifi:
  networks:
    - ssid: !secret wifi1_ad
      password: !secret wifi1_sifre
    - ssid: !secret wifi2_ad
      password: !secret wifi2_sifre
    # Telefon hotspot'u (ev ağı yetişmezse; o zaman MQTT yok, değerler web sayfasında)
    - ssid: !secret wifi3_ad
      password: !secret wifi3_sifre
      priority: -1
    - ssid: !secret wifi3b_ad
      password: !secret wifi3_sifre
      priority: -1
  # Telefon hotspot'una bağlanınca adresini telefona bildir (orada MQTT/panel yok)
  on_connect:
    - delay: 10s
    - if:
        condition:
          lambda: 'return id(wifi_ag).state.rfind("Redmi", 0) == 0;'
        then:
          - http_request.post:
              url: https://ntfy.sh/${ntfy_konu}
              request_headers:
                Title: "Aku dugumu telefona baglandi"
                Tags: "battery"
                Click: !lambda 'static std::string u; u = "http://" + id(wifi_ip).state; return u.c_str();'
              body: !lambda 'return "Değerler için dokun: http://" + id(wifi_ip).state;'
  ap:
    ssid: "Aku-Dugumu Fallback Hotspot"
    password: !secret yedek_ag_sifre

captive_portal:

http_request:
  verify_ssl: true
  timeout: 10s
  watchdog_timeout: 15s

# Kendi web sayfası: telefondan http://<ESP adresi> → tüm değerler (MQTT olmadan da)
web_server:
  port: 80
  version: 3

mqtt:
  broker: 192.168.1.117
  # Home Assistant kullanmıyoruz; açılışta 40+ tanıtım mesajı zayıf WiFi'de döngüyü kilitleyip
  # watchdog yeniden başlatmasına yol açıyordu (2026-11-07, inci -90 dBm)
  discovery: false
  # Mesajları kuyruğa koyup arka planda gönder: zayıf hatta yayın ana döngüyü kilitlemesin (watchdog)
  idf_send_async: true

# Akü BMS (Daly uyumlu, Bluetooth adı JHB-501905011293)
esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: "50:19:05:01:12:93"
    id: bms_ble

daly_bms_ble:
  - ble_client_id: bms_ble
    id: bms
    password: 12345678
    status_registers: 62
    update_interval: 10s
    response_timeout: 3s

switch:
  # Kapatılırsa telefon uygulaması aküye bağlanabilir (aynı anda tek bağlantı)
  - platform: ble_client
    ble_client_id: bms_ble
    name: "BMS Baglanti"
    id: bms_baglanti

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Adresi"
      id: wifi_ip
    ssid:
      name: "WiFi Agi"
      id: wifi_ag
  - platform: daly_bms_ble
    daly_bms_ble_id: bms
    battery_status:
      name: "Aku Durum"
    errors:
      name: "Aku Hatalar"

sensor:
  - platform: daly_bms_ble
    daly_bms_ble_id: bms
    total_voltage:
      name: "Aku Voltaj"
    current:
      name: "Aku Akim"
      id: aku_akim
    power:
      name: "Aku Guc"
    state_of_charge:
      name: "Aku Doluluk"
    capacity_remaining:
      name: "Aku Kalan"
    charging_cycles:
      name: "Aku Dongu"
    min_cell_voltage:
      name: "Aku Min Hucre"
    max_cell_voltage:
      name: "Aku Max Hucre"
    delta_cell_voltage:
      name: "Aku Hucre Farki"
    temperature_1:
      name: "Aku Sicaklik 1"
      id: aku_t1
    temperature_2:
      name: "Aku Sicaklik 2"
      id: aku_t2
    cell_voltage_1:
      name: "Aku Hucre 1"
    cell_voltage_2:
      name: "Aku Hucre 2"
    cell_voltage_3:
      name: "Aku Hucre 3"
    cell_voltage_4:
      name: "Aku Hucre 4"
  # BMS sinyal gücü (akünün yanında iyi olmalı; 1. ESP'de -97 dBm idi)
  - platform: ble_client
    type: rssi
    ble_client_id: bms_ble
    name: "BMS Sinyal"
  - platform: wifi_signal
    name: "WiFi Sinyal"
    update_interval: 60s
  - platform: uptime
    name: "Calisma Suresi"

binary_sensor:
  - platform: daly_bms_ble
    daly_bms_ble_id: bms
    online_status:
      name: "BMS Bagli"
    charging:
      name: "Aku Sarj MOS"
    discharging:
      name: "Aku Desarj MOS"
    balancing:
      name: "Aku Dengeleme"

# LiFePO4 0 °C altında şarj edilmez (lityum kaplaması). BMS'in kendi koruması -20 °C'ye ayarlıydı
# (2026-11-08; uygulamadan 0 °C yapılmalı). Yedek: soğukta şarj 1 dk sürerse telefona bildir, 30 dk'da bir tekrar.
globals:
  - id: soguk_sn
    type: int
    initial_value: '0'
  - id: soguk_son
    type: uint32_t
    initial_value: '0'

interval:
  - interval: 10s
    then:
      - lambda: |-
          float t = NAN;
          if (!isnan(id(aku_t1).state)) t = id(aku_t1).state;
          if (!isnan(id(aku_t2).state)) t = isnan(t) ? id(aku_t2).state : std::min(t, id(aku_t2).state);
          bool soguk = !isnan(t) && !isnan(id(aku_akim).state) && id(aku_akim).state > 0.3f && t <= 1.0f;
          id(soguk_sn) = soguk ? id(soguk_sn) + 10 : 0;
          uint32_t simdi = esphome::millis();
          if (id(soguk_sn) >= 60 && (id(soguk_son) == 0 || simdi - id(soguk_son) > 1800000)) {
            id(soguk_son) = simdi;
            ESP_LOGW("aku", "Soğukta şarj: %.1f °C, %.1f A", t, id(aku_akim).state);
            id(soguk_uyar).execute();
          }

script:
  - id: soguk_uyar
    mode: single
    then:
      - http_request.post:
          url: https://ntfy.sh/${ntfy_konu}
          request_headers:
            Title: "Aku donma noktasinda sarj oluyor!"
            Priority: "high"
            Tags: "snowflake,battery"
          body: !lambda |-
            char b[120];
            float t = std::min(isnan(id(aku_t1).state) ? 99.0f : id(aku_t1).state, isnan(id(aku_t2).state) ? 99.0f : id(aku_t2).state);
            snprintf(b, sizeof(b), "Akü %.0f °C, şarj akımı %.1f A. 0 °C altında şarj aküye zarar verir; şarjı durdurun.", t, id(aku_akim).state);
            return std::string(b);
